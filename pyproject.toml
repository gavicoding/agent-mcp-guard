[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mcp-guard"
version = "1.0.0"
description = "Zero-dependency security scanner and SHA-256 rug-pull guard for AI agent configs and MCP servers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Gabriel Souza", email = "gavicoding@gmail.com"}
]
keywords = [
  "mcp",
  "model-context-protocol",
  "ai-security",
  "prompt-injection",
  "tool-poisoning",
  "sarif",
  "owasp",
  "devsecops"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security"
]
dependencies = []

[project.urls]
Homepage = "https://gavicoding.github.io/agent-mcp-guard/"
Repository = "https://github.com/gavicoding/agent-mcp-guard"
Issues = "https://github.com/gavicoding/agent-mcp-guard/issues"

[project.scripts]
agent-mcp-guard = "agent_mcp_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
