name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build agent-mcp-guard.exe
        run: |
          python -m pip install pyinstaller==6.22.3
          pyinstaller --onefile --name agent-mcp-guard --paths src tools/exe_entry.py
      - name: Smoke test the executable
        run: |
          dist\agent-mcp-guard.exe --version
          dist\agent-mcp-guard.exe scan samples/hardened-workspace --fail-on low --no-color
          dist\agent-mcp-guard.exe where
        shell: cmd
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >NUL 2>&1 || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file CHANGELOG.md
          gh release upload "${{ github.ref_name }}" dist\agent-mcp-guard.exe --clobber
        shell: cmd
